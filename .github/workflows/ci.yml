name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ merge/creatorapp24-into-Clone, main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run flake8
        run: |
          if [ -d backend ]; then
            flake8 backend || true
          else
            echo "No backend directory found; skipping flake8"
          fi
      - name: Run pytest (if tests present)
        run: |
          if [ -f backend_test.py ] || [ -d tests ] || [ -d backend/tests ]; then
            pytest -q
          else
            echo "No tests found; skipping pytest"
          fi

  frontend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install
      - name: Run frontend build
        run: yarn build
      - name: Run frontend tests
        run: yarn test --silent --watchAll=false || true
