name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ merge/creatorapp24-into-Clone, main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dev deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
      - name: Run flake8
        run: |
          if [ -d backend ]; then
            flake8 backend || true
          else
            echo "No backend directory found; skipping flake8"
          fi
      - name: Run pytest (if tests present)
        run: |
          if [ -d tests ] || [ -d backend/tests ]; then
            pytest -q
          else
            echo "No tests found; skipping pytest"
          fi

  frontend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            yarn install --frozen-lockfile || yarn install
          else
            echo "No frontend/package.json found; skipping install"
          fi
      - name: Run frontend build
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            yarn build
          else
            echo "No frontend to build"
          fi
      - name: Run frontend tests
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            yarn test --silent --watchAll=false || true
          else
            echo "No frontend tests"
          fi
